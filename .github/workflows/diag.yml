name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o cpu.onnx https://huggingface.co/adowu/htdemucs-6s-onnx/resolve/main/htdemucs_6s_fp16weights.onnx
          curl -sSL -o gpu.onnx https://huggingface.co/kramp/htdemucs-6s-webgpu-onnx/resolve/main/htdemucs_6s.onnx
          ls -la
          gh release create diag-models cpu.onnx gpu.onnx -R ${{ github.repository }} --target diag --prerelease --title "temporary test models" --notes "Temporary, for testing. Will be deleted."
        env:
          GH_TOKEN: ${{ github.token }}
